@if (showModal()) {
<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"
     (click)="closeModal()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-amber-100 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-inbox text-amber-600"></i>
        </div>
        <h3 class="text-lg font-bold text-gray-900">Request document from client</h3>
      </div>
      <button (click)="closeModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i class="fa-solid fa-xmark text-gray-500"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4">

      <!-- Link to Case -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Link to Case <span class="text-red-500">*</span>
        </label>

        @if (isLocked) {
          <!-- Locked amber display (case-detail mode) -->
          <div class="flex items-center space-x-3 bg-amber-50 border-2 border-amber-200 rounded-xl px-4 py-3">
            <i class="fa-solid fa-briefcase text-amber-500 flex-shrink-0"></i>
            <span class="text-sm font-semibold text-amber-800 truncate">{{ lockedCaseTitle || lockedCaseId }}</span>
            <span class="ml-auto text-xs bg-amber-100 text-amber-600 px-2 py-0.5 rounded-full font-medium flex-shrink-0">Current case</span>
          </div>
        } @else {
          <!-- Selectable dropdown (documents page mode) -->
          @if (selectedId()) {
            <div class="flex items-center space-x-3 bg-amber-50 border-2 border-amber-200 rounded-xl px-4 py-3 cursor-pointer"
                 (click)="selectedId.set('')">
              <i class="fa-solid fa-briefcase text-amber-500 flex-shrink-0"></i>
              <span class="text-sm font-semibold text-amber-800 truncate">
                {{ cases.find(c => c.id === selectedId())?.title ?? selectedId() }}
              </span>
              <span class="ml-auto text-xs bg-amber-100 text-amber-600 px-2 py-0.5 rounded-full font-medium flex-shrink-0">Selected</span>
            </div>
          } @else {
            <div class="relative">
              <select [ngModel]="selectedId()" (ngModelChange)="selectedId.set($event)"
                      class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-amber-500 appearance-none text-sm">
                <option value="">Select a case</option>
                @for (c of cases; track c.id) {
                  <option [value]="c.id">{{ c.caseNumber }} — {{ c.title }}</option>
                }
              </select>
              <i class="fa-solid fa-briefcase absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            </div>
          }
        }
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Document Description <span class="text-red-500">*</span>
        </label>
        <textarea rows="4" placeholder="e.g. National ID copy, signed contract, bank statement…"
                  [ngModel]="description()" (ngModelChange)="description.set($event)"
                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 text-sm bg-gray-50 focus:bg-white transition-all resize-none"></textarea>
      </div>

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end space-x-3 px-6 pb-6">
      <button (click)="closeModal()"
              class="px-4 py-2.5 text-sm text-gray-600 hover:bg-gray-100 rounded-xl transition-colors font-medium">
        Cancel
      </button>
      <button (click)="send()"
              [disabled]="!isValid || isSending()"
              class="px-6 py-2.5 text-sm font-semibold rounded-xl transition-all flex items-center gap-2"
              [ngClass]="isValid && !isSending()
                ? 'bg-amber-500 hover:bg-amber-600 text-white'
                : 'bg-gray-200 text-gray-400 cursor-not-allowed'">
        @if (isSending()) {
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        } @else {
          <i class="fa-solid fa-paper-plane"></i>
        }
        {{ isSending() ? 'Sending…' : 'Send Request' }}
      </button>
    </div>

  </div>
</div>
}
